# OpenOCD configuration for ST NUCLEO-G071RB (STM32G071RB)
# Interface: On-board ST-LINK
# Target: STM32G0x

source [find interface/stlink.cfg]

transport select hla_swd

source [find target/stm32g0x.cfg]

# Set adapter speed to 1800 kHz
adapter speed 1800

# Redefine the reset-start hook from target/stm32g0x.cfg to prevent it from resetting speed to 2000 kHz
proc stm32g0x_default_reset_start {} {
	adapter speed 1800
}

# Reset configuration - target/stm32g0x.cfg handles reset, but we declare srst compatibility
reset_config srst_only
